
name: Build Nokia Snake APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir extracted
          ZIP=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          unzip -q "$ZIP" -d extracted
          SETTINGS=$(find extracted -type f -name settings.gradle -print -quit)
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug --stacktrace --info 2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"
        continue-on-error: true
        id: build

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NokiaSnake-Build-Log
          path: build-log.txt
          if-no-files-found: ignore

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NokiaSnake-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          
