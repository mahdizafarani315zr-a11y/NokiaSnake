name: Build Nokia Snake APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
            - name: Install SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -iname '*.zip' -print -quit)
          test -n "$ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          SETTINGS=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$SETTINGS"
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          set -o pipefail
          gradle --no-daemon assembleDebug --stacktrace --info 2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NokiaSnake-Build-Log
          path: build-log.txt
          if-no-files-found: ignore

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NokiaSnake-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
